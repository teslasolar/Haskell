<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KONOMI:3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../config.js"></script>
<script src="../core/blocks/block.js"></script>
<script src="../academy/gate.js"></script>
<script src="world.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:'Courier New',monospace;background:#0a0a0f}
#hud{position:fixed;top:0;left:0;right:0;padding:1rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(10,10,15,0.9),transparent);z-index:100;pointer-events:none}
#hud>*{pointer-events:auto}
#hud h1{color:#00ff88;font-size:1.2rem;text-shadow:0 0 10px #00ff88}
#hud h1 span{color:#4a9eff}
#coords{color:#888;font-size:0.9rem}
#nav-btns{display:flex;gap:0.5rem}
#nav-btns button{background:#1a1a2e;color:#00ff88;border:1px solid #00ff88;padding:0.5rem 1rem;cursor:pointer;font-family:inherit;transition:all 0.2s}
#nav-btns button:hover{background:#00ff88;color:#0a0a0f}
#sidebar{position:fixed;right:0;top:60px;width:280px;background:rgba(10,10,15,0.95);border-left:1px solid #1a1a2e;padding:1rem;height:calc(100vh - 60px);overflow-y:auto;transform:translateX(100%);transition:transform 0.3s}
#sidebar.open{transform:translateX(0)}
#sidebar h3{color:#00ff88;margin-bottom:1rem;font-size:0.9rem}
.block-list{display:flex;flex-direction:column;gap:0.3rem}
.block-item{padding:0.5rem;background:#1a1a2e;border-radius:4px;cursor:pointer;font-size:0.8rem;color:#aaa;transition:all 0.2s}
.block-item:hover{background:#2a2a4e;color:#00ff88}
.block-item .coord{color:#4a9eff;font-size:0.7rem}
#minimap{position:fixed;bottom:1rem;left:1rem;width:150px;height:150px;background:rgba(10,10,15,0.9);border:1px solid #00ff88;border-radius:4px}
#minimap canvas{width:100%;height:100%}
#search{position:fixed;bottom:1rem;right:1rem;display:flex;gap:0.5rem}
#search input{background:#1a1a2e;color:#fff;border:1px solid #333;padding:0.5rem;width:200px;font-family:inherit}
#search button{background:#00ff88;color:#0a0a0f;border:none;padding:0.5rem 1rem;cursor:pointer}
.world-message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,170,0,0.9);color:#0a0a0f;padding:1rem 2rem;border-radius:8px;font-weight:bold;animation:fadeOut 2s forwards}
@keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#loading{position:fixed;inset:0;background:#0a0a0f;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;z-index:1000}
#loading h2{color:#00ff88}
#loading .spinner{width:50px;height:50px;border:3px solid #1a1a2e;border-top-color:#00ff88;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#instructions{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);color:#666;font-size:0.75rem;text-align:center}
</style>
</head><body>
<div id="loading"><div class="spinner"></div><h2>INITIALIZING GRID...</h2></div>

<div id="hud">
<h1>KONOMI:<span>3D</span></h1>
<span id="coords">B[0][0][0]</span>
<div id="nav-btns">
<button onclick="WORLD.flyTo(0,0,0)">Origin</button>
<button onclick="toggleSidebar()">Blocks</button>
<button onclick="location.href='../'">Exit</button>
</div>
</div>

<div id="sidebar">
<h3>BLOCK NAVIGATOR</h3>
<input type="text" id="filter" placeholder="Filter..." oninput="filterBlocks()" style="width:100%;margin-bottom:1rem;padding:0.5rem;background:#0a0a0f;border:1px solid #333;color:#fff">
<div id="block-list" class="block-list"></div>
</div>

<div id="minimap"><canvas id="minimap-canvas"></canvas></div>

<div id="search">
<input type="text" id="goto" placeholder="x,y,z or path">
<button onclick="gotoCoord()">Go</button>
</div>

<div id="instructions">
Drag to rotate • Scroll to zoom • Click block to navigate • WASD to move
</div>

<div id="container"></div>

<script>
let sidebarOpen = false;

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
}

function filterBlocks() {
  const q = document.getElementById('filter').value.toLowerCase();
  document.querySelectorAll('.block-item').forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(q) ? 'block' : 'none';
  });
}

function gotoCoord() {
  const val = document.getElementById('goto').value.trim();

  // Check if it's a path
  if (KONOMI && KONOMI.MAP[val]) {
    const [x, y, z] = KONOMI.MAP[val];
    WORLD.flyTo(x, y, z);
    return;
  }

  // Parse as coordinates
  const parts = val.split(',').map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) {
    WORLD.flyTo(...parts);
  }
}

function populateBlockList() {
  const list = document.getElementById('block-list');
  if (!window.KONOMI) return;

  Object.entries(KONOMI.MAP).forEach(([path, [x, y, z]]) => {
    const div = document.createElement('div');
    div.className = 'block-item';
    div.innerHTML = `${path} <span class="coord">B[${x}][${y}][${z}]</span>`;
    div.onclick = () => {
      WORLD.flyTo(x, y, z);
      toggleSidebar();
    };
    list.appendChild(div);
  });
}

function updateMinimap() {
  const canvas = document.getElementById('minimap-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 150;
  canvas.height = 150;

  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, 150, 150);

  // Draw grid
  ctx.strokeStyle = '#1a1a2e';
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(i * 15, 0);
    ctx.lineTo(i * 15, 150);
    ctx.moveTo(0, i * 15);
    ctx.lineTo(150, i * 15);
    ctx.stroke();
  }

  // Draw blocks
  if (window.KONOMI) {
    Object.values(KONOMI.MAP).forEach(([x, y, z]) => {
      const px = 75 + (x - WORLD.position.x) * 15;
      const py = 75 + (z - WORLD.position.z) * 15;

      ctx.fillStyle = '#00ff88';
      ctx.fillRect(px - 3, py - 3, 6, 6);
    });
  }

  // Draw camera position
  ctx.fillStyle = '#ff4488';
  ctx.beginPath();
  ctx.arc(75, 75, 5, 0, Math.PI * 2);
  ctx.fill();
}

// Keyboard controls
document.addEventListener('keydown', (e) => {
  const speed = 1;
  switch(e.key.toLowerCase()) {
    case 'w': WORLD.position.z -= speed; break;
    case 's': WORLD.position.z += speed; break;
    case 'a': WORLD.position.x -= speed; break;
    case 'd': WORLD.position.x += speed; break;
    case 'q': WORLD.position.y -= speed; break;
    case 'e': WORLD.position.y += speed; break;
  }
  document.getElementById('coords').textContent = `B[${WORLD.position.x}][${WORLD.position.y}][${WORLD.position.z}]`;
  updateMinimap();
});

// Initialize
window.addEventListener('load', () => {
  setTimeout(() => {
    const container = document.getElementById('container');
    WORLD.init(container);

    // Load blocks from KONOMI map
    if (window.KONOMI && KONOMI.MAP) {
      WORLD.loadFromMap(KONOMI.MAP);
    }

    // Add some demo blocks in the 1000³ space
    for (let i = 0; i < 50; i++) {
      const x = Math.floor(Math.random() * 20);
      const y = Math.floor(Math.random() * 10);
      const z = Math.floor(Math.random() * 20);
      if (!WORLD.blocks.has(`${x},${y},${z}`)) {
        WORLD.createBlock(x, y, z, {
          type: 'locked',
          label: `?`,
          locked: true
        });
      }
    }

    populateBlockList();
    updateMinimap();
    setInterval(updateMinimap, 1000);

    document.getElementById('loading').style.display = 'none';
  }, 500);
});
</script>
</body></html>
