<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KONOMI APP</title>
<link rel="stylesheet" href="css/style.css">
<script src="config.js"></script>
<script src="core/blocks/block.js" defer></script>
<script src="core/chain/chain.js" defer></script>
<script src="core/chain/cube.js" defer></script>
<script src="core/chain/run.js" defer></script>
<script src="core/templates/atomic.js" defer></script>
<script src="core/compiler/haskell.js" defer></script>
<script src="ml/index.js" defer></script>
<script src="ai/index.js" defer></script>
</head><body>
<div class="container">
<header><h1>KONOMI:<span>APP</span></h1><p class="subtitle">Full Orchestrator</p></header>

<section>
<h2>EXECUTE BY COORDINATE</h2>
<div class="exec-row">
<input id="ex" placeholder="x,y,z,fn" value="3,1,1,compile">
<input id="ea" placeholder="args" value="">
<button onclick="execCoord()">Run</button>
</div>
<pre id="exec-out"></pre>
</section>

<section>
<h2>HASKELL</h2>
<textarea id="src" rows="3">double x = x * 2</textarea>
<div class="toolbar">
<button onclick="RUN.call(3,1,1,'run',document.getElementById('src').value).then(r=>show('hs-out',r))">Run</button>
<button onclick="show('hs-out',RUN.call(3,1,1,'compile',document.getElementById('src').value))">Parse</button>
</div>
<pre id="hs-out"></pre>
</section>

<section>
<h2>ML / AI</h2>
<div class="toolbar">
<button onclick="show('ml-out',ML.linear.fit([[1,2],[2,4],[3,6]]).predict(4))">Linear</button>
<button onclick="show('ml-out',ML.knn.fit([[[0,0],'A'],[[1,1],'B']],1).predict([0.5,0.5]))">KNN</button>
<button onclick="show('ml-out',AI.astar.search(0,5,n=>[n+1,n+2].filter(x=>x<=5),(a,b)=>Math.abs(a-b)))">A*</button>
<button onclick="show('ml-out',AI.nn.forward(AI.nn.create([2,3,1]),[0.5,0.5]))">NN</button>
</div>
<pre id="ml-out"></pre>
</section>

<section>
<h2>CUBE NAVIGATOR</h2>
<div id="cube-nav"></div>
<pre id="cube-info"></pre>
</section>

<section>
<h2>CHAIN</h2>
<pre id="chain-info"></pre>
</section>

<footer>K:app|B[0][0][2]</footer>
</div>

<style>
.exec-row{display:flex;gap:.5rem;margin-bottom:.5rem}
.exec-row input{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:.4rem;font-family:inherit}
#src{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:.5rem;font-family:inherit}
.toolbar{display:flex;gap:.5rem;margin:.5rem 0;flex-wrap:wrap}
.toolbar button{background:var(--border);color:var(--text);border:none;padding:.4rem .8rem;cursor:pointer;border-radius:4px}
.toolbar button:hover{background:var(--accent)}
pre{background:var(--bg);border:1px solid var(--border);padding:.5rem;min-height:30px;overflow-x:auto}
#cube-nav{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
#cube-nav button{background:var(--surface);color:var(--accent);border:1px solid var(--border);padding:.3rem .5rem;cursor:pointer;font-size:.75rem}
</style>

<script>
const show=(id,v)=>document.getElementById(id).textContent=typeof v==='object'?JSON.stringify(v,null,2):String(v);

function execCoord(){
  const[x,y,z,fn]=document.getElementById('ex').value.split(',');
  const args=document.getElementById('ea').value;
  const a=args?args.split(','):[];
  const r=RUN.call(+x,+y,+z,fn.trim(),...a);
  show('exec-out',r);
}

document.addEventListener('DOMContentLoaded',()=>{
  try {
    if(!window.KONOMI){
      document.body.innerHTML='<div style="color:#ff4488;padding:2rem">Error: KONOMI not loaded. Check console.</div>';
      return;
    }
    if(!window.CHAIN || !window.CUBE || !window.RUN){
      document.body.innerHTML='<div style="color:#ff4488;padding:2rem">Error: Chain/Cube/Run not loaded. Check console.</div>';
      return;
    }
    CHAIN.init();CUBE.init();RUN.init();

    // Cube nav
    const nav=document.getElementById('cube-nav');
    [...CUBE.walk()].slice(0,20).forEach(c=>{
      const b=document.createElement('button');
      b.textContent=c.data.path;
      b.onclick=()=>show('cube-info',`B[${c.coord.join('][')}]\n${c.data.url}\nup:${c.up()?.data.path||'-'} down:${c.down()?.data.path||'-'}\nleft:${c.left()?.data.path||'-'} right:${c.right()?.data.path||'-'}`);
      nav.appendChild(b);
    });

    // Chain info
    show('chain-info',`Blocks:${CHAIN.blocks.length} Valid:${CHAIN.verify().valid}\nGenesis:${CHAIN.blocks[0]?.hash}\nLatest:${CHAIN.blocks[CHAIN.blocks.length-1]?.hash}`);
  } catch(e) {
    console.error('App init error:', e);
    document.body.innerHTML='<div style="color:#ff4488;padding:2rem">Error: '+e.message+'</div>';
  }
});
</script>
</body></html>
